<div class="min-h-screen bg-olive-50 pb-20 lg:pb-0">
  <!-- Barre du haut : menu complet sur ordinateur -->
  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-6 px-4 sm:px-6">
      <a routerLink="/agriculteur" aria-label="Accueil de mon espace"><app-logo /></a>

      <nav class="hidden items-center gap-1 lg:flex" aria-label="Menu de l'espace agriculteur">
        @for (entree of menu; track entree.adresse) {
          <a
            [routerLink]="entree.adresse"
            routerLinkActive="bg-olive-100 text-olive-900"
            [routerLinkActiveOptions]="{ exact: entree.exact }"
            class="rounded-lg px-4 py-2 text-sm font-semibold text-gray-600 hover:bg-olive-50 hover:text-olive-900"
          >
            {{ entree.libelle }}
          </a>
        }
      </nav>

      <div class="flex items-center gap-4">
        <span class="hidden text-sm text-gray-600 sm:block">{{ authentification.session()?.prenom }} {{ authentification.session()?.nom }}</span>
        <button type="button" (click)="authentification.deconnecter()" class="inline-flex items-center gap-2 rounded-lg border border-olive-700 px-3 py-2 text-sm font-semibold text-olive-700 hover:bg-olive-50">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M12 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7" /></svg>
          <span class="hidden sm:inline">Se déconnecter</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:py-10">
    <router-outlet />
  </main>

  <!-- Barre d'onglets en bas : téléphone seulement -->
  <nav class="fixed inset-x-0 bottom-0 z-20 grid grid-cols-5 border-t border-gray-200 bg-white lg:hidden" aria-label="Menu de l'espace agriculteur">
    @for (entree of menu; track entree.adresse) {
      <a
        [routerLink]="entree.adresse"
        routerLinkActive="text-olive-700"
        [routerLinkActiveOptions]="{ exact: entree.exact }"
        class="flex flex-col items-center gap-1 py-2 text-[11px] font-semibold text-gray-500"
      >
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="entree.icone" />
        </svg>
        {{ entree.libelle }}
      </a>
    }
  </nav>
</div>
